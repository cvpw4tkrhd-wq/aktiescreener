name: Top 5

on:
  schedule:
    # Måndagar 06:00 UTC: uppdaterar kurserna (själva listan ligger fast under året)
    - cron: "0 6 * * 1"
    # 1 och 2 januari 06:00 UTC: skapar den nya årslistan när det nya året börjat
    - cron: "0 6 1,2 1 *"
  workflow_dispatch:
    inputs:
      recompute:
        description: "Räkna om listan från grunden (annars behålls årets lista och bara kurserna uppdateras)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  top5:
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut repot
        uses: actions/checkout@v4

      - name: Sätt upp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installera beroenden
        run: pip install -r requirements.txt lxml

      - name: Kör Top 5
        run: python scripts/top5.py ${{ inputs.recompute && '--recompute' || '' }}

      - name: Committa listan
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/top5.json
          git diff --cached --quiet && echo "Inga förändringar" || git commit -m "Uppdatera Top 5 $(date -u +'%Y-%m-%d')"
          git pull --rebase
          git push
