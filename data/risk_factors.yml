# Geopolitiska/makroekonomiska riskfaktorer.
#
# Detta är INTE en automatiskt uppdaterad fil. Claude uppdaterar den bara när
# du ber om en avstämning ("kolla geopolitiska läget"), söker aktuella
# nyheter, föreslår ändringar här, och pushar sedan filen först efter att du
# godkänt förslaget i chatten.
#
# Varje faktor kan ha vikter per SEKTOR och/eller per LAND (-20 till +20):
#   positiv vikt  = medvind (höjer köppoäng, sänker säljpoäng)
#   negativ vikt  = motvind (sänker köppoäng, höjer säljpoäng)
# En faktor kan ha båda, bara en av dem, eller flera länder/sektorer samtidigt.
#
# Sektorer som används i watchlist.yml: Industrials, Technology, Consumer,
# Financials, RealEstate, Semiconductors, Energy, Healthcare, Materials,
# Telecom. Länder (marknadskoder): SE, US, DE, NL, GB.
# Valfria fält `name_en`/`summary_en` visas när appen körs på engelska (v9.2).
# Valfritt fält `markets: ["SE", ...]` begränsar en faktors SEKTORVIKTER till
# bolag noterade på de marknaderna (citera koderna – NO tolkas annars som falskt).
# Sammanlagd geopolitisk vikt per aktie begränsas i koden till ±10 (v8.8).

factors:
  - name: "Iran-konflikten / Hormuzsundet"
    name_en: "Iran conflict / Strait of Hormuz"
    updated: 2026-11-07
    summary_en: "The war between the US/Israel and Iran has been going on since 28 February 2026 and the Strait of Hormuz is still effectively closed: Straits counted 2 transits on 25 October against roughly 85 a day before the war. The situation stayed tense this week: the US attacked Qeshm Island on 2–3 November, an Indian seafarer was killed in an attack in the strait on 3 November, and the US maintains a blockade of Iranian oil exports. Oil prices have nevertheless fallen sharply: Brent rose above 110 dollars on Monday 2 November, fell almost 9% on 4 November and closed at 98.32 dollars on 6 November (WTI 90.83), down more than 16% on the week, the biggest weekly drop since April 2020. The drop is linked to hopes of diplomacy, including that Iran, according to Reuters, sent a nuclear proposal to Washington via Qatar, but Rapidan Energy puts the probability of fighting resuming after the US election at 80%. Brent is still more than 50% above its level a year ago. Disrupts oil flows and pushes up prices of critical materials that the semiconductor industry depends on. Higher oil prices benefit energy companies, while high rates weigh on rate-sensitive real estate companies. The figures come from the news flow and daily situation reports (Straits, an AI-assisted digest) and should be read as approximate. The energy weight was lowered from +5 to +3 on 7 November (approved) because Brent has fallen sharply, but it can reverse quickly if fighting resumes."
    summary: "Kriget mellan USA/Israel och Iran har pågått sedan 28 februari 2026 och Hormuzsundet är i praktiken fortfarande stängt: Straits räknade 2 passager den 25 oktober mot cirka 85 per dag före kriget. Läget var fortsatt spänt under veckan: USA attackerade Qeshm-ön den 2–3 november, en indisk sjöman dödades i en attack i sundet den 3 november och USA upprätthåller en blockad av Irans oljeexport. Oljepriset har samtidigt fallit kraftigt: Brent steg över 110 dollar på måndagen den 2 november, föll nästan 9 % den 4 november och stängde den 6 november på 98,32 dollar (WTI 90,83), ned över 16 % på veckan, det största veckofallet sedan april 2020. Prisfallet kopplas till förhoppningar om diplomati, bland annat att Iran enligt Reuters skickat ett kärnenergiförslag till Washington via Qatar, men Rapidan Energy bedömer 80 % sannolikhet att striderna återupptas efter det amerikanska valet. Brent ligger kvar drygt 50 % över nivån för ett år sedan. Stör oljeflöden och driver upp priser på kritiska material som halvledarindustrin är beroende av. Högre oljepris gynnar energibolag, medan höga räntor pressar räntekänsliga fastighetsbolag. Uppgifterna kommer från nyhetsflödet och dagliga lägesrapporter (Straits, ett AI-assisterat sammandrag) och ska läsas som ungefärliga. Energivikten sänktes den 7 november från +5 till +3 (godkänt) eftersom Brent fallit kraftigt, men den kan vändas snabbt om striderna återupptas."
    sectors:
      Semiconductors: -10
      Energy: 3   # v11.14: sänkt från 5 (godkänt 2026-11-07) efter Brent-fallet
      RealEstate: -5
    source_url: "https://www.cnbc.com/2026/11/06/oil-price-today-brent-wti.html"
  - name: "USA-Kina teknikrivalitet / exportkontroller"
    name_en: "US-China tech rivalry / export controls"
    updated: 2026-11-07
    summary: "USA och Kina enades vid toppmötet i Washington den 24 september om att förlänga handelsvapenvilan med två månader, från 10 november till 10 januari 2027. Det som tidigare inte var bekräftat är nu klart: BIS har lagt ut en slutlig regel, som enligt Federal Register publiceras den 9 november, som förlänger pausen av dotterbolagsregeln (50-procentsregeln) till 10 januari 2027, så regeln återinförs inte den 10 november. Mötet gav inga lättnader för avancerade chip eller utrustning för chiptillverkning, och Kinas leveranser av sällsynta jordartsmetaller ligger enligt USA fortfarande efter åtagandena. Nvidias H200 säljs till Kina bara med licens från handelsdepartementet (BIS) i varje enskilt fall. Enligt flera källor löper Kinas egen paus av sina exportkontroller på sällsynta jordartsmetaller ut den 10 november och pausen för gallium och germanium den 27 november; någon förlängning hade inte publicerats den 26 oktober och jag har inte hittat någon sedan dess. Lagförslaget i kongressen om exportstopp för utrustning till chiptillverkning (berör ASML) är inte omkontrollerat sedan 21 oktober. Kontrollerat den 7 november: ingen upptrappning hittades. Risken för en snabb upptrappning har minskat, men osäkerheten ligger kvar för halvledarbolag, särskilt kring vad som händer efter 10 januari 2027."
    summary_en: "At the summit in Washington on 24 September the US and China agreed to extend the trade truce by two months, from 10 November to 10 January 2027. What was previously unconfirmed is now settled: BIS has issued a final rule, scheduled for Federal Register publication on 9 November, extending the suspension of the Affiliates Rule (the 50% ownership rule) to 10 January 2027, so the rule does not return on 10 November. The summit gave no easing for advanced chips or chipmaking equipment, and according to the US China's rare-earth deliveries still fall short of its commitments. Nvidia's H200 is sold to China only under case-by-case licences from the Commerce Department (BIS). According to several sources China's own suspension of its rare-earth export controls expires on 10 November and its suspension for gallium and germanium on 27 November; no extension had been published on 26 October and I have found none since. The congressional bill to stop exports of chipmaking equipment (affects ASML) has not been rechecked since 21 October. Checked on 7 November: no escalation was found. The risk of rapid escalation has fallen, but uncertainty remains for semiconductor companies, especially over what happens after 10 January 2027."
    sectors:
      Semiconductors: -10
    source_url: "https://public-inspection.federalregister.gov/2026-22793.pdf"
  - name: "USA-tullar mot Sverige/EU"
    name_en: "US tariffs on Sweden/EU"
    updated: 2026-11-07
    summary_en: "After the Supreme Court struck down the earlier IEEPA tariffs in February 2026, a temporary global tariff of 10% (Section 122) was introduced, which expired on 24 July. The same day a new Section 301 tariff took effect for 60 countries: for the EU the tariff plus the ordinary duty may not exceed 10% combined, and for Switzerland, Japan and South Korea 12.5%. Goods that already carry specific Section 232 tariffs (including steel, aluminium, copper, cars, semiconductors and patented pharmaceuticals) are not covered by the new tariff. The Section 232 pharmaceutical tariff applies from 31 July for large companies and 29 September for others: 100% as the default but 15% for the EU, Japan, South Korea and Switzerland. The EU–US framework agreement, in force since 1 July, gives a general 15% ceiling, and the US has until 31 December 2026 to bring tariffs on EU steel and aluminium derivatives down to that ceiling, or the EU may withdraw its tariff preferences. Hits export-dependent Swedish industrial companies (Volvo, Atlas Copco, Sandvik etc.) and pharmaceutical companies. Several analysts (JP Morgan, Handelsbanken) judge the effect as manageable rather than serious, partly because large companies are investing in US production to avoid the tariffs – hence a moderate weight. Also applies to France (EU) and Switzerland, which has the same 15% ceiling as the EU, including for pharmaceuticals. Checked on 7 November: no new tariff announcements against the EU or Sweden were found since 21 October, and the 31 December 2026 deadline for steel and aluminium derivatives still stands."
    summary: "Efter att Högsta domstolen i februari 2026 underkänt de tidigare IEEPA-tullarna infördes en tillfällig global tull på 10 % (Section 122), som löpte ut den 24 juli. Samma dag trädde en ny tull enligt Section 301 i kraft för 60 länder: för EU får tullen tillsammans med den ordinarie tullen inte överstiga 10 %, och för Schweiz, Japan och Sydkorea 12,5 %. Varor som redan har särskilda Section 232-tullar (bland annat stål, aluminium, koppar, bilar, halvledare och patenterade läkemedel) omfattas inte av den nya tullen. Läkemedelstullen enligt Section 232 gäller sedan 31 juli för stora bolag och 29 september för övriga: 100 % som grundnivå men 15 % för EU, Japan, Sydkorea och Schweiz. Ramavtalet mellan EU och USA, som trädde i kraft den 1 juli, ger ett allmänt tak på 15 %, och USA har till den 31 december 2026 på sig att sänka tullarna på EU:s stål- och aluminiumderivat till det taket, annars kan EU dra tillbaka sina tullförmåner. Drabbar exportberoende svenska industribolag (Volvo, Atlas Copco, Sandvik m.fl.) och läkemedelsbolag. Flera analytiker (JP Morgan, Handelsbanken) bedömer effekten som hanterbar snarare än allvarlig, delvis eftersom storbolag investerar i amerikansk produktion för att undvika tullarna – därför måttlig vikt. Gäller även Frankrike (EU) och Schweiz, som har samma tak på 15 % som EU, även för läkemedel. Kontrollerat den 7 november: inga nya tullbesked mot EU eller Sverige hittades sedan 21 oktober, och fristen den 31 december 2026 för stål- och aluminiumderivaten gäller fortfarande."
    # Gäller bara bolag noterade i EU/EES och Schweiz (v8.8, FR/CH tillagda v10.4) – amerikanska bolag drabbas inte av USA:s egna tullar.
    markets: ["SE", "FI", "NO", "DK", "DE", "NL", "FR", "CH", "IT", "ES", "BE"]
    sectors:
      Industrials: -5
      Healthcare: -5
    source_url: "https://ostsvenskahandelskammaren.se/internationell-handel/trump-tullar-och-handelspolitik-det-har-galler/"
  - name: "ECB-räntehöjning (Irankrigsdriven inflation)"
    name_en: "ECB rate hike (Iran-war-driven inflation)"
    updated: 2026-11-07
    summary_en: "On 29 October 2026 the ECB left all three key rates unchanged, as expected: the deposit rate is 2.50% (main refinancing rate 2.65% and marginal lending rate 2.90%), after the hike on 10 September. The Council said the energy shock from the Middle East conflict creates risks in both directions, that the direction of travel is clear but it does not pre-commit to a path, and that the TPI backstop remains available against disorderly market moves. An ING economist reads the press conference as preparing a hike in December. Euro area inflation was 3.8% in September (3.2% in August), the highest since September 2023. Lagarde announced the same day that she will step down on 7 February 2027, nine months before the end of her term. Raises financing costs for companies in the euro area (Germany, the Netherlands, France) and the UK, which is hit by the same energy price shock. Sweden no longer diverges: on 4 November the Riksbank raised the policy rate by 0.25 percentage points to 2.00% (effective 11 November), citing inflation expected to rise as the economy strengthens and persistent cost pressure. After approval on 7 November SE carries a weight of -3 like the other rate-sensitive markets, and Italy, Spain and Belgium (euro area) have been added at -3."
    summary: "ECB lämnade den 29 oktober 2026 alla tre styrräntorna oförändrade, i linje med förväntningarna: inlåningsräntan är 2,50 % (huvudräntan 2,65 % och utlåningsräntan 2,90 %), efter höjningen den 10 september. Rådet sa att energichocken från Mellanösternkonflikten skapar risker åt båda håll, att ränteriktningen är tydlig men att man inte binder sig vid en bana, och att stödinstrumentet TPI finns tillgängligt vid oordnade marknadsrörelser. En ING-ekonom tolkar presskonferensen som att en höjning i december förbereds. Inflationen i euroområdet var 3,8 % i september (3,2 % i augusti), den högsta nivån sedan september 2023. Lagarde meddelade samma dag att hon lämnar posten den 7 februari 2027, nio månader före mandatperiodens slut. Ökar finansieringskostnader för bolag i euroområdet (Tyskland, Nederländerna, Frankrike) och Storbritannien, som drabbas av samma energiprischock. Sverige avviker inte längre: Riksbanken höjde den 4 november styrräntan med 0,25 procentenheter till 2,00 % (gäller från 11 november), med motiveringen att inflationen väntas stiga när konjunkturen stärks och kostnadstrycket är högt. Efter godkännande den 7 november har SE vikt -3 som övriga ränteberoende marknader, och Italien, Spanien och Belgien (euroområdet) har lagts till med -3."
    countries:
      DE: -3
      NL: -3
      FR: -3   # v10.4 – euroområdet (Schweiz har egen centralbank och påverkas inte)
      GB: -3
      SE: -3   # v11.14 (godkänt 2026-11-07): Riksbanken höjde till 2,00 % den 4 november
      IT: -3   # v11.14 (godkänt): euroområdet
      ES: -3
      BE: -3
    source_url: "https://www.banque-france.fr/system/files/2026-10/Monetary_policy_decisions_29-10.pdf"
  - name: "Ryssland/NATO – hybridhot och gränsincidenter"
    name_en: "Russia/NATO – hybrid threats and border incidents"
    updated: 2026-11-07
    # Ingen vikt – visas bara som bevakning (godkänt 2026-09-30). Ingen tydlig,
    # mätbar kurseffekt ännu; läggs vikt senare krävs nytt godkännande.
    summary: "En rysk Mi-8-helikopter kränkte den 23 september polskt luftrum vid Braniewo nära Kaliningrad, vilket ISW beskriver som en tydlig upptrappning av Rysslands aggressiva beteende mot NATO-länder. Europeiska underrättelsetjänster varnar för att Ryssland kan agera öppet aggressivt mot NATO under de närmaste månaderna, medan baltiska företrädare betonar att det inte finns tecken på förberedelser för ett nära förestående angrepp. Den hybrida kampanjen fortsätter – tyska myndigheter har formellt pekat ut Ryssland för drönarattacken mot Leipzigs flygplats i augusti. Kontrollerat den 7 november: inga större nya incidenter, men drönarintrången i Baltikum fortsätter. En drönare med sprängämne exploderade i Litauen den 18 oktober (Litauen säger att den kom via Polen, Ukraina kopplar händelsen till rysk störsändning), vrakdelar av en drönare hittades i Lettland den 24 oktober, och en oidentifierad drönare kränkte lettiskt luftrum den 1 november, varpå Lettland satte in en avlyssningsdrönare. Ingen vikt sätts eftersom ingen tydlig effekt på aktiekurserna syns ännu."
    summary_en: "On 23 September a Russian Mi-8 helicopter violated Polish airspace at Braniewo near Kaliningrad, which ISW describes as a marked escalation of Russia's aggressive behaviour towards NATO states. European intelligence services warn that Russia may act openly aggressively against NATO in the coming months, while Baltic officials stress that there are no signs of preparations for an imminent attack. The hybrid campaign continues – German authorities have formally blamed Russia for the drone attack on Leipzig airport in August. Checked on 7 November: no major new incidents, but drone incursions in the Baltics continue. A drone carrying explosives blew up in Lithuania on 18 October (Lithuania says it came via Poland, Ukraine links the incident to Russian jamming), wreckage of a drone was found in Latvia on 24 October, and an unidentified drone violated Latvian airspace on 1 November, after which Latvia deployed an interceptor drone. No weight is set because no clear effect on stock prices is visible yet."
    source_url: "https://www.eurointegration.com.ua/eng/news/2026/11/2/7249074/"
  - name: "Fed och amerikanska långräntor"
    name_en: "Fed and US long-term yields"
    updated: 2026-11-07
    # v11.14 (godkänt 2026-11-07): landsvikt -3 för USA, samma nivå som ECB har för euroområdet.
    # Överlappar delvis stabilitetspoängen (som justerar alla aktier +-2), men landsvikten speglar Feds egen räntebana.
    summary: "Fed lämnade den 28 oktober 2026 styrräntan oförändrad på 3,75–4,00 % med rösterna 10–2, under ordförande Kevin Warsh, efter höjningen på 0,25 procentenheter den 16 september. Marknaden prisade efter beslutet omkring 85 % chans till en höjning vid nästa möte den 9 december. Septembers konsumentpriser steg 0,6 % mellan månaderna och kärninflationen var 2,6 % på årsbasis. Amerikanska långräntor har gett sig från topparna: 10-årsräntan nådde 5,34 % den 1 oktober (högsta sedan 2002), låg på cirka 5,03 % vid Fed-beslutet och var 4,84 % den 6 november, medan 2-årsräntan föll 12 punkter till 4,46 % efter att oktoberrapporten visade 165 000 nya jobb, mot förväntade cirka 55 000. Höga långräntor pressar räntekänsliga bolag som fastigheter och tillväxtbolag. Efter godkännande den 7 november har USA vikt -3 (som ECB för euroområdet); stabilitetspoängen under Makro fångar ränteläget brett, så vikten är måttlig för att inte räkna samma sak dubbelt."
    summary_en: "On 28 October 2026 the Fed left the policy rate unchanged at 3.75–4.00% in a 10–2 vote, under Chair Kevin Warsh, after the 0.25 percentage point hike on 16 September. After the decision the market priced about an 85% chance of a hike at the next meeting on 9 December. September consumer prices rose 0.6% month on month and core inflation was 2.6% year on year. US long-term yields have eased from their peaks: the 10-year yield reached 5.34% on 1 October (the highest since 2002), stood at about 5.03% at the Fed decision and was 4.84% on 6 November, while the 2-year yield fell 12 basis points to 4.46% after the October report showed 165,000 new jobs against about 55,000 expected. High long-term yields weigh on rate-sensitive companies such as real estate and growth stocks. After approval on 7 November the US carries a weight of -3 (like the ECB for the euro area); the stability score under Macro captures the rate environment broadly, so the weight is kept moderate to avoid counting the same thing twice."
    countries:
      US: -3
    source_url: "https://stockanalysis.com/news/fed-holds-rates-steady-oct-2026/"

