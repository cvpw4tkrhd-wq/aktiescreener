  - name: "ECB-räntehöjning (Irankrigsdriven inflation)"
    name_en: "ECB rate hike (Iran-war-driven inflation)"
    updated: 2026-10-21
    summary_en: "On 10 September 2026 the ECB raised all three key rates by 0.25 percentage points: the deposit rate is 2.50% (main refinancing rate 2.65% and marginal lending rate 2.90%), the second hike this year, citing inflationary pressure from the Middle East conflict. Since then inflation has accelerated: euro area inflation rose to 3.8% in September (from 3.2% in August), the highest since September 2023, with core inflation at 2.5% and services inflation at 3.2%. The ECB is expected to hike at least two more times, but the market probability of a hike at the next meeting has faded; one analyst expects a final hike in December. The next rate decision comes on 29 October (the meeting is held 28–29 October). Raises financing costs for companies in the euro area (Germany, the Netherlands, France) and the UK, which is hit by the same energy price shock. Sweden deliberately diverges – on 24 September the Riksbank left the policy rate unchanged at 1.75%, where it has been for a year, so no weight is set on SE."
    summary: "ECB höjde den 10 september 2026 alla tre styrräntorna med 0,25 procentenheter: inlåningsräntan är 2,50 % (huvudräntan 2,65 % och utlåningsräntan 2,90 %), årets andra höjning, med hänvisning till inflationstryck från konflikten i Mellanöstern. Sedan dess har inflationen accelererat: euroområdets inflation steg till 3,8 % i september (från 3,2 % i augusti), den högsta nivån sedan september 2023, med kärninflation på 2,5 % och tjänsteinflation på 3,2 %. ECB väntas höja räntan minst två gånger till, men marknadens sannolikhet för en höjning vid nästa möte har minskat; en bedömare räknar med en sista höjning i december. Nästa räntebesked kommer den 29 oktober (mötet hålls 28–29 oktober). Ökar finansieringskostnader för bolag i euroområdet (Tyskland, Nederländerna, Frankrike) och Storbritannien, som drabbas av samma energiprischock. Sverige avviker medvetet – Riksbanken lämnade den 24 september styrräntan oförändrad på 1,75 %, där den legat i ett år, så ingen vikt sätts på SE."
    countries:
      DE: -3
      NL: -3
      FR: -3   # v10.4 – euroområdet (Schweiz har egen centralbank och påverkas inte)
      GB: -3
    source_url: "https://www.ecb.europa.eu/press/pr/date/2026/html/ecb.mp260910~314e508016.sv.html"
  - name: "Ryssland/NATO – hybridhot och gränsincidenter"
    name_en: "Russia/NATO – hybrid threats and border incidents"
    updated: 2026-10-21
    # Ingen vikt – visas bara som bevakning (godkänt 2026-09-30). Ingen tydlig,
    # mätbar kurseffekt ännu; läggs vikt senare krävs nytt godkännande.
    summary: "En rysk Mi-8-helikopter kränkte den 23 september polskt luftrum vid Braniewo nära Kaliningrad, vilket ISW beskriver som en tydlig upptrappning av Rysslands aggressiva beteende mot NATO-länder. Europeiska underrättelsetjänster varnar för att Ryssland kan agera öppet aggressivt mot NATO under de närmaste månaderna, medan baltiska företrädare betonar att det inte finns tecken på förberedelser för ett nära förestående angrepp. Den hybrida kampanjen fortsätter – tyska myndigheter har formellt pekat ut Ryssland för drönarattacken mot Leipzigs flygplats i augusti. Kontrollerat den 15 oktober: inga större nya incidenter har hittats sedan 30 september, men luftrumsintrången fortsätter – Litauens försvarsministerium registrerade sex kränkningar av NATO:s luftrum i augusti, och misstänkta ryska drönare störtade i Rumänien och Moldavien den 24 september. Kontrollerat den 21 oktober: inga nya större incidenter hittades sedan 15 oktober. Ingen vikt sätts eftersom ingen tydlig effekt på aktiekurserna syns ännu."
    summary_en: "On 23 September a Russian Mi-8 helicopter violated Polish airspace at Braniewo near Kaliningrad, which ISW describes as a marked escalation of Russia's aggressive behaviour towards NATO states. European intelligence services warn that Russia may act openly aggressively against NATO in the coming months, while Baltic officials stress that there are no signs of preparations for an imminent attack. The hybrid campaign continues – German authorities have formally blamed Russia for the drone attack on Leipzig airport in August. Checked on 15 October: no major new incidents have been found since 30 September, but airspace violations continue – Lithuania's defence ministry recorded six violations of NATO airspace in August, and suspected Russian drones crashed in Romania and Moldova on 24 September. Checked on 21 October: no new major incidents were found since 15 October. No weight is set because no clear effect on stock prices is visible yet."
    source_url: "https://www.kyivpost.com/post/85279"
  - name: "Fed och amerikanska långräntor"
    name_en: "Fed and US long-term yields"
    updated: 2026-10-21
    # Ingen vikt (förslag 2026-10-21): överlappar stabilitetspoängen, som redan drar poäng på alla aktier när
    # räntorna är höga. En landsvikt för USA kräver nytt godkännande.
    summary: "Fed höjde den 16 september 2026 styrräntan med 0,25 procentenheter till 3,75–4,00 %, första höjningen sedan 2023 och med enhällig röst (12–0). Sexton av arton ledamöter räknar i sina prognoser med minst en höjning till i år, och Fed ser 2026 års PCE-inflation på 3,7 %. Nästa besked kommer den 28 oktober (mötet hålls 27–28 oktober), och därefter den 9 december. Marknaden prisade i mitten av oktober in omkring 25 % chans till en höjning i oktober men 75–85 % till årsskiftet, och Fed-tjänstemän har sagt att det inte finns någon brådska. Amerikanska långräntor ligger högt: 10-årsräntan var 5,09 % och 30-årsräntan 5,43 % den 16 oktober, efter toppar på cirka 5,33 % respektive 5,71 % tidigare i oktober, drivna av höga oljepriser och stigande räntor i Europa. Höga långräntor pressar räntekänsliga bolag som fastigheter och tillväxtbolag. Ingen vikt sätts eftersom stabilitetspoängen under Makro redan fångar ränteläget och en egen vikt skulle räkna samma sak två gånger."
    summary_en: "On 16 September 2026 the Fed raised its policy rate by 0.25 percentage points to 3.75–4.00%, the first hike since 2023 and by a unanimous vote (12–0). Sixteen of eighteen members project at least one more hike this year, and the Fed sees 2026 PCE inflation at 3.7%. The next decision comes on 28 October (the meeting is held 27–28 October), and then on 9 December. In mid-October the market priced in about a 25% chance of a hike in October but 75–85% by year-end, and Fed officials have said there is no need for urgency. US long-term yields are high: the 10-year yield was 5.09% and the 30-year yield 5.43% on 16 October, after peaks of about 5.33% and 5.71% earlier in October, driven by high oil prices and rising yields in Europe. High long-term yields weigh on rate-sensitive companies such as real estate and growth stocks. No weight is set because the stability score under Macro already captures the rate environment and a separate weight would count the same thing twice."
    source_url: "https://www.chase.com/personal/investments/learning-and-insights/article/will-the-federal-reserve-hike-rates-at-october-2026-fomc-meeting"

