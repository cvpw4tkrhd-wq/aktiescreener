# Geopolitiska/makroekonomiska riskfaktorer.
#
# Detta är INTE en automatiskt uppdaterad fil. Claude uppdaterar den bara när
# du ber om en avstämning ("kolla geopolitiska läget"), söker aktuella
# nyheter, föreslår ändringar här, och pushar sedan filen först efter att du
# godkänt förslaget i chatten.
#
# Varje faktor kan ha vikter per SEKTOR och/eller per LAND (-20 till +20):
#   positiv vikt  = medvind (höjer köppoäng, sänker säljpoäng)
#   negativ vikt  = motvind (sänker köppoäng, höjer säljpoäng)
# En faktor kan ha båda, bara en av dem, eller flera länder/sektorer samtidigt.
#
# Sektorer som används i watchlist.yml: Industrials, Technology, Consumer,
# Financials, RealEstate, Semiconductors, Energy, Healthcare, Materials,
# Telecom. Länder (marknadskoder): SE, US, DE, NL, GB.
# Valfria fält `name_en`/`summary_en` visas när appen körs på engelska (v9.2).
# Valfritt fält `markets: ["SE", ...]` begränsar en faktors SEKTORVIKTER till
# bolag noterade på de marknaderna (citera koderna – NO tolkas annars som falskt).
# Sammanlagd geopolitisk vikt per aktie begränsas i koden till ±10 (v8.8).

factors:
  - name: "Iran-konflikten / Hormuzsundet"
    name_en: "Iran conflict / Strait of Hormuz"
    updated: 2026-10-15
    summary_en: "The war between the US/Israel and Iran has been going on since 28 February 2026 and the Strait of Hormuz is still effectively closed: according to IMF PortWatch only 4 vessels passed on 4 October against roughly 85 a day before the war. Tanker attacks have, according to the Financial Times, reached a wartime high, and nearly 20 commercial ships have been attacked over the past month according to CNBC. Iran says the strait stays closed until its seven conditions are met, while US Central Command disputes that picture; on 8 October Iran said it would respond within days to Washington's reply, and no response had been reported by 12 October. Brent settled at 104.72 dollars on 9 October (against about 99 dollars on 8 September) and the US 10-year yield is above 5%. Disrupts oil flows and pushes up prices of critical materials that the semiconductor industry depends on. Higher oil prices benefit energy companies, while high rates weigh on rate-sensitive real estate companies. The figures come from daily situation reports (Straits, an AI-assisted digest of the news flow) and should be read as approximate."
    summary: "Kriget mellan USA/Israel och Iran har pågått sedan 28 februari 2026 och Hormuzsundet är i praktiken fortfarande stängt: enligt IMF PortWatch passerade bara 4 fartyg den 4 oktober mot cirka 85 per dag före kriget. Tankerattackerna har enligt Financial Times nått en krigstida högstanivå, och nästan 20 handelsfartyg har enligt CNBC attackerats den senaste månaden. Iran säger att sundet förblir stängt tills landets sju villkor uppfylls, medan USA:s centralkommando bestrider bilden; Iran sa den 8 oktober att man skulle svara inom dagar på Washingtons besked, och något svar hade inte rapporterats den 12 oktober. Brent stängde på 104,72 dollar den 9 oktober (mot cirka 99 dollar den 8 september) och 10-årsräntan i USA ligger över 5 %. Stör oljeflöden och driver upp priser på kritiska material som halvledarindustrin är beroende av. Högre oljepris gynnar energibolag, medan höga räntor pressar räntekänsliga fastighetsbolag. Uppgifterna är hämtade ur dagliga lägesrapporter (Straits, ett AI-assisterat sammandrag av nyhetsflödet) och ska läsas som ungefärliga."
    sectors:
      Semiconductors: -10
      Energy: 5
      RealEstate: -5
    source_url: "https://straits.live/briefs/2026-10-12"
  - name: "USA-Kina teknikrivalitet / exportkontroller"
    name_en: "US-China tech rivalry / export controls"
    updated: 2026-10-15
    summary: "USA och Kina enades vid toppmötet i Washington den 24 september om att förlänga handelsvapenvilan med två månader, från 10 november till 10 januari 2027. Mötet gav inga lättnader för avancerade chip eller utrustning för chiptillverkning, och Kinas leveranser av sällsynta jordartsmetaller ligger enligt USA fortfarande efter åtagandena. Nvidias H200 säljs till Kina bara med licens från handelsdepartementet (BIS) i varje enskilt fall. Den så kallade dotterbolagsregeln är formellt pausad till 9 november 2026, och om pausen följer med förlängningen av vapenvilan är inte bekräftat. I kongressen drivs dessutom ett lagförslag om exportstopp för utrustning till chiptillverkning som kan leda till motåtgärder från EU om det används mot nederländsk utrustning (berör ASML). Risken för en snabb upptrappning har minskat, men osäkerheten ligger kvar för halvledarbolag."
    summary_en: "At the summit in Washington on 24 September the US and China agreed to extend the trade truce by two months, from 10 November to 10 January 2027. The summit gave no easing for advanced chips or chipmaking equipment, and according to the US China's rare-earth deliveries still fall short of its commitments. Nvidia's H200 is sold to China only under case-by-case licences from the Commerce Department (BIS). The so-called affiliates rule is formally paused until 9 November 2026, and whether the pause follows the truce extension is not confirmed. Congress is also pushing a bill to stop exports of chipmaking equipment that could trigger EU countermeasures if used against Dutch equipment (affects ASML). The risk of rapid escalation has fallen, but uncertainty remains for semiconductor companies."
    sectors:
      Semiconductors: -10
    source_url: "https://www.home.saxo/en-gb/content/articles/macro/trumpxi-summit-stability-not-a-breakthrough-25092026"
  - name: "USA-tullar mot Sverige/EU"
    name_en: "US tariffs on Sweden/EU"
    updated: 2026-10-06
    summary_en: "The US has introduced broad tariffs (about 10% generally on most goods, 50% on steel/aluminium, up to 100% on pharmaceuticals outside the EU agreement, which otherwise caps the tariff at 15%). Hits export-dependent Swedish industrial companies (Volvo, Atlas Copco, Sandvik etc.) and pharmaceutical companies. Several analysts (JP Morgan, Handelsbanken) judge the effect as 'manageable' rather than serious, partly because large companies are investing in US production to avoid the tariffs – hence a moderate weight. Also applies to France (EU) and Switzerland, which since the framework agreement of November 2025 has the same 15% ceiling as the EU, including for pharmaceuticals (SECO, August 2026)."
    summary: "USA infört breda tullar (ca 10% generellt på de flesta varor, 50% på stål/aluminium, upp till 100% på läkemedel utanför EU-avtalet som annars tak:ar tullen vid 15%). Träffar exportberoende svenska industribolag (Volvo, Atlas Copco, Sandvik m.fl.) och läkemedelsbolag. Flera analytiker (JP Morgan, Handelsbanken) bedömer effekten som 'hanterbar' snarare än allvarlig, delvis eftersom storbolag investerar i amerikansk produktion för att undvika tullarna - därför måttlig vikt. Gäller även Frankrike (EU) och Schweiz, som sedan ramavtalet i november 2025 har samma tak på 15 % som EU, även för läkemedel (SECO, augusti 2026)."
    # Gäller bara bolag noterade i EU/EES och Schweiz (v8.8, FR/CH tillagda v10.4) – amerikanska bolag drabbas inte av USA:s egna tullar.
    markets: ["SE", "FI", "NO", "DK", "DE", "NL", "FR", "CH"]
    sectors:
      Industrials: -5
      Healthcare: -5
    source_url: "https://ostsvenskahandelskammaren.se/internationell-handel/trump-tullar-och-handelspolitik-det-har-galler/"
  - name: "ECB-räntehöjning (Irankrigsdriven inflation)"
    name_en: "ECB rate hike (Iran-war-driven inflation)"
    updated: 2026-10-15
    summary_en: "On 10 September 2026 the ECB raised all three key rates by 0.25 percentage points: the deposit rate is 2.50% (main refinancing rate 2.65% and marginal lending rate 2.90%), the second hike this year, citing inflationary pressure from the Middle East conflict. The next rate decision comes on 29 October (the meeting is held 28–29 October). Euro area inflation was 3.2% in August, and at the end of September the market priced in roughly a 60% chance of another hike in October; Danske Bank expects hikes both in October and at year-end. The account of the ECB's September meeting was published on 8 October. Raises financing costs for companies in the euro area (Germany, the Netherlands, France) and the UK, which is hit by the same energy price shock. Sweden deliberately diverges – on 24 September the Riksbank left the policy rate unchanged at 1.75%, where it has been for a year, so no weight is set on SE."
    summary: "ECB höjde den 10 september 2026 alla tre styrräntorna med 0,25 procentenheter: inlåningsräntan är 2,50 % (huvudräntan 2,65 % och utlåningsräntan 2,90 %), årets andra höjning, med hänvisning till inflationstryck från konflikten i Mellanöstern. Nästa räntebesked kommer den 29 oktober (mötet hålls 28–29 oktober). Euroområdets inflation var 3,2 % i augusti, och marknaden prisade i slutet av september in cirka 60 % sannolikhet för en ny höjning i oktober; Danske Bank räknar med höjningar både i oktober och vid årsskiftet. ECB:s sammanfattning av septembermötet publicerades den 8 oktober. Ökar finansieringskostnader för bolag i euroområdet (Tyskland, Nederländerna, Frankrike) och Storbritannien, som drabbas av samma energiprischock. Sverige avviker medvetet – Riksbanken lämnade den 24 september styrräntan oförändrad på 1,75 %, där den legat i ett år, så ingen vikt sätts på SE."
    countries:
      DE: -3
      NL: -3
      FR: -3   # v10.4 – euroområdet (Schweiz har egen centralbank och påverkas inte)
      GB: -3
    source_url: "https://www.ecb.europa.eu/press/pr/date/2026/html/ecb.mp260910~314e508016.sv.html"
  - name: "Ryssland/NATO – hybridhot och gränsincidenter"
    name_en: "Russia/NATO – hybrid threats and border incidents"
    updated: 2026-10-15
    # Ingen vikt – visas bara som bevakning (godkänt 2026-09-30). Ingen tydlig,
    # mätbar kurseffekt ännu; läggs vikt senare krävs nytt godkännande.
    summary: "En rysk Mi-8-helikopter kränkte den 23 september polskt luftrum vid Braniewo nära Kaliningrad, vilket ISW beskriver som en tydlig upptrappning av Rysslands aggressiva beteende mot NATO-länder. Europeiska underrättelsetjänster varnar för att Ryssland kan agera öppet aggressivt mot NATO under de närmaste månaderna, medan baltiska företrädare betonar att det inte finns tecken på förberedelser för ett nära förestående angrepp. Den hybrida kampanjen fortsätter – tyska myndigheter har formellt pekat ut Ryssland för drönarattacken mot Leipzigs flygplats i augusti. Kontrollerat den 15 oktober: inga större nya incidenter har hittats sedan 30 september, men luftrumsintrången fortsätter – Litauens försvarsministerium registrerade sex kränkningar av NATO:s luftrum i augusti, och misstänkta ryska drönare störtade i Rumänien och Moldavien den 24 september. Ingen vikt sätts eftersom ingen tydlig effekt på aktiekurserna syns ännu."
    summary_en: "On 23 September a Russian Mi-8 helicopter violated Polish airspace at Braniewo near Kaliningrad, which ISW describes as a marked escalation of Russia's aggressive behaviour towards NATO states. European intelligence services warn that Russia may act openly aggressively against NATO in the coming months, while Baltic officials stress that there are no signs of preparations for an imminent attack. The hybrid campaign continues – German authorities have formally blamed Russia for the drone attack on Leipzig airport in August. Checked on 15 October: no major new incidents have been found since 30 September, but airspace violations continue – Lithuania's defence ministry recorded six violations of NATO airspace in August, and suspected Russian drones crashed in Romania and Moldova on 24 September. No weight is set because no clear effect on stock prices is visible yet."
    source_url: "https://www.kyivpost.com/post/85279"

