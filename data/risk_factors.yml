factors:
  - name: "Iran-konflikten / Hormuzsundet"
    updated: 2026-09-07
    summary: "Konflikten i Mellanöstern har eskalerat sedan början av september - oljepriset har stigit kraftigt (Brent +5% på en dag) och asiatiska börser föll (Nikkei -2,9%). Stör oljeflöden genom Hormuzsundet och driver upp priser på kritiska material (t.ex. volfram) som halvledarindustrin är beroende av. Svenska analytiker (bl.a. Nordea) pekar ut kriget tillsammans med stigande långräntor som huvudorsak till börsoron i september. Högre oljepris gynnar energibolag, medan stigande räntor pressar räntekänsliga fastighetsbolag."
    sectors:
      Semiconductors: -10
      Energy: 5
      RealEstate: -5
    source_url: "https://sourceability.com/post/geopolitics-are-reshaping-semiconductor-supply-chain-risk-in-2026"
  - name: "USA-Kina teknikrivalitet / exportkontroller"
    updated: 2026-09-02
    summary: "Fortsatta amerikanska exportrestriktioner mot Kina och osäkerhet kring handelspolitik skapar press på halvledarbolag, enligt bl.a. Deloittes och BlackRocks 2026-analyser."
    sectors:
      Semiconductors: -10
    source_url: "https://www.deloitte.com/us/en/insights/industry/technology/technology-media-telecom-outlooks/semiconductor-industry-outlook.html"
  - name: "USA-tullar mot Sverige/EU"
    updated: 2026-09-07
    summary: "USA infört breda tullar (ca 10% generellt på de flesta varor, 50% på stål/aluminium, upp till 100% på läkemedel utanför EU-avtalet som annars tak:ar tullen vid 15%). Träffar exportberoende svenska industribolag (Volvo, Atlas Copco, Sandvik m.fl.) och läkemedelsbolag. Flera analytiker (JP Morgan, Handelsbanken) bedömer effekten som 'hanterbar' snarare än allvarlig, delvis eftersom storbolag investerar i amerikansk produktion för att undvika tullarna - därför måttlig vikt."
    sectors:
      Industrials: -5
      Healthcare: -5
    source_url: "https://ostsvenskahandelskammaren.se/internationell-handel/trump-tullar-och-handelspolitik-det-har-galler/"
  - name: "ECB-räntehöjning (Irankrigsdriven inflation)"
    updated: 2026-09-07
    summary: "ECB väntas höja styrräntan från 2,25% till 2,50% den 10 september 2026, uttryckligen för att dämpa inflationseffekter av Irankrigets energiprisuppgång. Ökar finansieringskostnader för bolag i euroområdet och Storbritannien (där Bank of England också pressas i samma riktning). Sverige avviker medvetet - Riksbanken avvaktar eftersom svensk inflation (KPIF 0,7%) är klart lägre än euroområdets, så ingen vikt sätts på SE."
    countries:
      DE: -3
      NL: -3
      GB: -3
    source_url: "https://hurbra.se/ecb-ranta-10-september-2026/"

