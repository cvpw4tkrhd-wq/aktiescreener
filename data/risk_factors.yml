# Geopolitiska/makroekonomiska riskfaktorer.
#
# Detta är INTE en automatiskt uppdaterad fil. Claude uppdaterar den bara när
# du ber om en avstämning ("kolla geopolitiska läget"), söker aktuella
# nyheter, föreslår ändringar här, och pushar sedan filen först efter att du
# godkänt förslaget i chatten.
#
# Varje faktor kan ha vikter per SEKTOR och/eller per LAND (-20 till +20):
#   positiv vikt  = medvind (höjer köppoäng, sänker säljpoäng)
#   negativ vikt  = motvind (sänker köppoäng, höjer säljpoäng)
# En faktor kan ha båda, bara en av dem, eller flera länder/sektorer samtidigt.
#
# Sektorer som används i watchlist.yml: Industrials, Technology, Consumer,
# Financials, RealEstate, Semiconductors, Energy, Healthcare, Materials,
# Telecom. Länder (marknadskoder): SE, US, DE, NL, GB.
# Valfria fält `name_en`/`summary_en` visas när appen körs på engelska (v9.2).
# Valfritt fält `markets: ["SE", ...]` begränsar en faktors SEKTORVIKTER till
# bolag noterade på de marknaderna (citera koderna – NO tolkas annars som falskt).
# Sammanlagd geopolitisk vikt per aktie begränsas i koden till ±10 (v8.8).

factors:
  - name: "Iran-konflikten / Hormuzsundet"
    name_en: "Iran conflict / Strait of Hormuz"
    updated: 2026-10-21
    summary_en: "The war between the US/Israel and Iran has been going on since 28 February 2026 and the Strait of Hormuz is still effectively closed: according to IMF PortWatch only 2 vessels passed on 11 October against roughly 85 a day before the war, and 124 vessels were idling outside the strait on 19 October. The situation has sharpened since 15 October: The Guardian reported that Iranian attacks have sunk two ships, and Iran's Revolutionary Guard says a tanker that did not comply with its rules hit a sea mine south of the strait, which no maritime authority has confirmed. At the same time Iran is, according to Reuters, urging the US to accept its proposal to reopen the strait, and the offer is described as still on the table. Brent stood at 108.02 dollars on 19 October (105.38 on 15 October and 104.72 at the close on 9 October, against about 99 dollars on 8 September) and WTI at 100.88. Disrupts oil flows and pushes up prices of critical materials that the semiconductor industry depends on. Higher oil prices benefit energy companies, while high rates weigh on rate-sensitive real estate companies. The figures come from daily situation reports (Straits, an AI-assisted digest of the news flow) and should be read as approximate."
    summary: "Kriget mellan USA/Israel och Iran har pågått sedan 28 februari 2026 och Hormuzsundet är i praktiken fortfarande stängt: enligt IMF PortWatch passerade bara 2 fartyg den 11 oktober mot cirka 85 per dag före kriget, och 124 fartyg låg stilla utanför sundet den 19 oktober. Läget har skärpts sedan den 15 oktober: The Guardian rapporterade att iranska attacker sänkt två fartyg, och Irans revolutionsgarde säger att en tankbåt som inte följt deras regler träffade en minan söder om sundet, vilket inte bekräftats av någon sjöfartsmyndighet. Samtidigt uppmanar Iran enligt Reuters USA att acceptera Irans förslag om att öppna sundet, och erbjudandet beskrivs som fortfarande öppet. Brent stod på 108,02 dollar den 19 oktober (105,38 den 15 oktober och 104,72 vid stängningen den 9 oktober, mot cirka 99 dollar den 8 september) och WTI på 100,88. Stör oljeflöden och driver upp priser på kritiska material som halvledarindustrin är beroende av. Högre oljepris gynnar energibolag, medan höga räntor pressar räntekänsliga fastighetsbolag. Uppgifterna är hämtade ur dagliga lägesrapporter (Straits, ett AI-assisterat sammandrag av nyhetsflödet) och ska läsas som ungefärliga."
    sectors:
      Semiconductors: -10
      Energy: 5
      RealEstate: -5
    source_url: "https://straits.live/briefs/2026-10-19"
  - name: "USA-Kina teknikrivalitet / exportkontroller"
    name_en: "US-China tech rivalry / export controls"
    updated: 2026-10-21
    summary: "USA och Kina enades vid toppmötet i Washington den 24 september om att förlänga handelsvapenvilan med två månader, från 10 november till 10 januari 2027. Mötet gav inga lättnader för avancerade chip eller utrustning för chiptillverkning, och Kinas leveranser av sällsynta jordartsmetaller ligger enligt USA fortfarande efter åtagandena. Nvidias H200 säljs till Kina bara med licens från handelsdepartementet (BIS) i varje enskilt fall. Den så kallade dotterbolagsregeln är formellt pausad till 9 november 2026, och om pausen följer med förlängningen av vapenvilan är inte bekräftat. I kongressen drivs dessutom ett lagförslag om exportstopp för utrustning till chiptillverkning som kan leda till motåtgärder från EU om det används mot nederländsk utrustning (berör ASML). Kontrollerat den 21 oktober: inga nya besked hittades sedan toppmötet. Risken för en snabb upptrappning har minskat, men osäkerheten ligger kvar för halvledarbolag."
    summary_en: "At the summit in Washington on 24 September the US and China agreed to extend the trade truce by two months, from 10 November to 10 January 2027. The summit gave no easing for advanced chips or chipmaking equipment, and according to the US China's rare-earth deliveries still fall short of its commitments. Nvidia's H200 is sold to China only under case-by-case licences from the Commerce Department (BIS). The so-called affiliates rule is formally paused until 9 November 2026, and whether the pause follows the truce extension is not confirmed. Congress is also pushing a bill to stop exports of chipmaking equipment that could trigger EU countermeasures if used against Dutch equipment (affects ASML). Checked on 21 October: no new announcements have been found since the summit. The risk of rapid escalation has fallen, but uncertainty remains for semiconductor companies."
    sectors:
      Semiconductors: -10
    source_url: "https://www.home.saxo/en-gb/content/articles/macro/trumpxi-summit-stability-not-a-breakthrough-25092026"
  - name: "USA-tullar mot Sverige/EU"
    name_en: "US tariffs on Sweden/EU"
    updated: 2026-10-21
    summary_en: "After the Supreme Court struck down the earlier IEEPA tariffs in February 2026, a temporary global tariff of 10% (Section 122) was introduced, which expired on 24 July. The same day a new Section 301 tariff took effect for 60 countries: for the EU the tariff plus the ordinary duty may not exceed 10% combined, and for Switzerland, Japan and South Korea 12.5%. Goods that already carry specific Section 232 tariffs (including steel, aluminium, copper, cars, semiconductors and patented pharmaceuticals) are not covered by the new tariff. The Section 232 pharmaceutical tariff applies from 31 July for large companies and 29 September for others: 100% as the default but 15% for the EU, Japan, South Korea and Switzerland. The EU–US framework agreement, in force since 1 July, gives a general 15% ceiling, and the US has until 31 December 2026 to bring tariffs on EU steel and aluminium derivatives down to that ceiling, or the EU may withdraw its tariff preferences. Hits export-dependent Swedish industrial companies (Volvo, Atlas Copco, Sandvik etc.) and pharmaceutical companies. Several analysts (JP Morgan, Handelsbanken) judge the effect as manageable rather than serious, partly because large companies are investing in US production to avoid the tariffs – hence a moderate weight. Also applies to France (EU) and Switzerland, which has the same 15% ceiling as the EU, including for pharmaceuticals."
    summary: "Efter att Högsta domstolen i februari 2026 underkänt de tidigare IEEPA-tullarna infördes en tillfällig global tull på 10 % (Section 122), som löpte ut den 24 juli. Samma dag trädde en ny tull enligt Section 301 i kraft för 60 länder: för EU får tullen tillsammans med den ordinarie tullen inte överstiga 10 %, och för Schweiz, Japan och Sydkorea 12,5 %. Varor som redan har särskilda Section 232-tullar (bland annat stål, aluminium, koppar, bilar, halvledare och patenterade läkemedel) omfattas inte av den nya tullen. Läkemedelstullen enligt Section 232 gäller sedan 31 juli för stora bolag och 29 september för övriga: 100 % som grundnivå men 15 % för EU, Japan, Sydkorea och Schweiz. Ramavtalet mellan EU och USA, som trädde i kraft den 1 juli, ger ett allmänt tak på 15 %, och USA har till den 31 december 2026 på sig att sänka tullarna på EU:s stål- och aluminiumderivat till det taket, annars kan EU dra tillbaka sina tullförmåner. Drabbar exportberoende svenska industribolag (Volvo, Atlas Copco, Sandvik m.fl.) och läkemedelsbolag. Flera analytiker (JP Morgan, Handelsbanken) bedömer effekten som hanterbar snarare än allvarlig, delvis eftersom storbolag investerar i amerikansk produktion för att undvika tullarna – därför måttlig vikt. Gäller även Frankrike (EU) och Schweiz, som har samma tak på 15 % som EU, även för läkemedel."
    # Gäller bara bolag noterade i EU/EES och Schweiz (v8.8, FR/CH tillagda v10.4) – amerikanska bolag drabbas inte av USA:s egna tullar.
    markets: ["SE", "FI", "NO", "DK", "DE", "NL", "FR", "CH"]
