# Bevakningslista för screenern.
# Svenska tickers behöver .ST-suffix (Yahoo Finance-format), t.ex. VOLV-B.ST
# Amerikanska tickers skrivs som vanligt, t.ex. AAPL
#
# Lägg till/ta bort rader efter eget tycke. "name" är bara för visning
# och för att matcha mot innehav om ticker saknas i CSV-exporten.
# "country" används för landssammanfattningen i dashboarden (faktiskt
# noterings-/hemland, inte samma sak som se/us-indelningen ovan — t.ex.
# NWG.L ligger under se: av bevakningsskäl men har country: Storbritannien).

