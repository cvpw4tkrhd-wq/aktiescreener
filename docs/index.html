<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screener</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Screener">
<meta name="theme-color" content="#0B0E13">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0E13;
    --panel: #12161D;
    --panel-alt: #171C24;
    --border: #262B34;
    --text: #E7E9EC;
    --text-dim: #8A93A3;
    --text-faint: #565E6C;
    --up: #4FD1A0;
    --down: #E8685C;
    --amber: #DDA83F;
    --amber-dim: #6B5A2C;
    --radius: 3px;
  }
  [data-theme="light"] {
    --bg: #F4F2ED;
    --panel: #FFFFFF;
    --panel-alt: #ECE9E2;
    --border: #DAD5C9;
    --text: #1B1D1F;
    --text-dim: #5B5F66;
    --text-faint: #9A9E9F;
    --up: #16855C;
    --down: #B5342A;
    --amber: #97701C;
    --amber-dim: #D8C89A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    transition: background .2s, color .2s;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 20px 80px; }

  header.top {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 18px;
    margin-bottom: 6px;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 30px;
    letter-spacing: -0.01em;
    margin: 0;
  }
  h1 em { font-style: italic; color: var(--amber); }
  .meta-line {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-faint);
    margin-top: 4px;
  }
  .controls { display: flex; gap: 10px; align-items: center; }
  button.iconbtn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: var(--radius);
    padding: 7px 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    cursor: pointer;
  }
  button.iconbtn:hover { border-color: var(--text-dim); color: var(--text); }
  a.version-badge { text-decoration: none; color: var(--text-faint); }
  a.version-badge:hover { color: var(--text-dim); border-color: var(--text-dim); }

  .tabs {
    display: flex;
    gap: 2px;
    margin: 22px 0 0;
  }
  .tab {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    padding: 9px 16px;
    color: var(--text-dim);
    background: var(--panel-alt);
    border: 1px solid var(--border);
    border-bottom: none;
    cursor: pointer;
    border-radius: var(--radius) var(--radius) 0 0;
  }
  .tab.active { color: var(--text); background: var(--panel); border-bottom: 1px solid var(--panel); position: relative; top: 1px; }
  .tab .count { color: var(--amber); margin-left: 6px; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 0 var(--radius) var(--radius) var(--radius);
    padding: 4px 0;
  }

  .filter-row {
    display: flex;
    gap: 8px;
    padding: 14px 18px 10px;
    flex-wrap: wrap;
  }
  select, input[type=text] {
    background: var(--panel-alt);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 7px 9px;
    border-radius: var(--radius);
    flex: 1 1 150px;
    min-width: 0;
  }

  table { width: 100%; border-collapse: collapse; }
  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  thead th {
    text-align: left;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-faint);
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    white-space: nowrap;
  }
  thead th:hover { color: var(--text-dim); }
  thead th.num, td.num { text-align: right; }
  tbody tr { border-bottom: 1px solid var(--border); cursor: pointer; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--panel-alt); }
  td { padding: 11px 14px; font-size: 13.5px; vertical-align: middle; }
  td.num { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--text-dim); white-space: nowrap; text-transform: uppercase; }
  td.name { max-width: 220px; }
  .tkr { color: var(--text-faint); font-family: 'IBM Plex Mono', monospace; font-size: 11px; display: block; margin-top: 1px; }
  .mkt-badge { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text-faint); border: 1px solid var(--border); border-radius: 2px; padding: 1px 5px; margin-left: 6px; }
  .mkt-badge.prev-held { display: block; width: fit-content; margin: 2px 0 0; color: var(--amber); border-color: var(--amber-dim); }
  .signal-flag {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.03em;
    border-radius: 2px;
    padding: 1px 6px;
    margin-left: 8px;
    vertical-align: middle;
  }
  .signal-flag.flag-buy { color: var(--up); border: 1px solid var(--up); }
  .signal-flag.flag-sell { color: var(--down); border: 1px solid var(--down); }
  .signal-flag.flag-hold { color: var(--amber); border: 1px solid var(--amber); }
  .score-delta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    white-space: nowrap;
  }
  .mkt-badge.days-badge { color: var(--amber); border-color: var(--amber-dim); }
  .info-btn {
    background: none; border: 1px solid var(--border); color: var(--text-faint);
    border-radius: var(--radius); width: 24px; height: 24px; cursor: pointer; font-size: 13px;
    line-height: 1;
  }
  .info-btn:hover { color: var(--text); border-color: var(--text-dim); }
  .score-bar-wrap { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .score-bar { width: 46px; height: 4px; background: var(--panel-alt); border-radius: 2px; overflow: hidden; }
  .score-bar > div { height: 100%; }
  .score-num { font-family: 'IBM Plex Mono', monospace; width: 24px; text-align: right; }
  .buy .score-bar > div { background: var(--up); }
  .sell .score-bar > div { background: var(--down); }

  .up-txt { color: var(--up); }
  .down-txt { color: var(--down); }
  .dim { color: var(--text-faint); }

  .empty {
    padding: 60px 20px;
    text-align: center;
    color: var(--text-faint);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
  }

  /* Detail drawer */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    display: none; align-items: flex-start; justify-content: center;
    padding: 60px 16px; z-index: 10;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .overlay.show { display: flex; }
  .drawer {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    max-width: 480px; width: 100%;
    padding: 24px;
    max-height: calc(100vh - 120px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .drawer h2 { font-family: 'Fraunces', serif; font-weight: 600; margin: 0 0 2px; font-size: 22px; }
  .drawer .tkr-line { font-family: 'IBM Plex Mono', monospace; color: var(--text-faint); font-size: 12px; margin-bottom: 18px; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-bottom: 18px; }
  .stat-grid .stat-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text-faint); }
  .stat-grid .stat-val { font-family: 'IBM Plex Mono', monospace; font-size: 16px; margin-top: 3px; text-transform: uppercase; }
  .stat-wide { grid-column: 1 / -1; }
  .sma-trend { display: inline-block; margin: 0 2px; font-size: 13px; }
  .reasons { list-style: none; margin: 0; padding: 0; }
  .reasons li {
    font-size: 13px;
    padding: 8px 0;
    border-top: 1px solid var(--border);
    color: var(--text-dim);
  }
  .drawer-close {
    float: right;
    background: none; border: none; color: var(--text-faint);
    font-family: 'IBM Plex Mono', monospace; cursor: pointer; font-size: 13px;
  }
    .ai-writeup {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .ai-writeup-date { color: var(--text-faint); font-weight: normal; }
  .ai-writeup-text {
    font-size: 13px;
    line-height: 1.55;
    color: var(--text);
    margin: 8px 0;
  }
  .ai-writeup-disclaimer {
    font-size: 11px;
    color: var(--text-faint);
    font-style: italic;
    margin-top: 6px;
  }

  footer.note {
    margin-top: 26px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-faint);
    line-height: 1.6;
  }

  .summary-panel {
    margin-top: 18px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 18px;
  }
  .summary-panel h3 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-faint);
    font-weight: 500;
    margin: 0 0 12px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .summary-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }
  .summary-block + .summary-block { margin-top: 20px; }
  .summary-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 5px 0;
    font-size: 12.5px;
  }
  .summary-row .label { flex: 0 0 auto; min-width: 92px; color: var(--text-dim); }
  .summary-row .bar-track {
    flex: 1 1 auto; height: 6px; background: var(--panel-alt); border-radius: 3px; overflow: hidden;
  }
  .summary-row .bar-fill { height: 100%; background: var(--amber); }
  .summary-row .val { flex: 0 0 auto; font-family: 'IBM Plex Mono', monospace; color: var(--text-faint); width: 20px; text-align: right; }
  .summary-stats {
    display: flex; flex-wrap: wrap; gap: 22px; margin-bottom: 20px;
  }
  .summary-stat .num { font-family: 'IBM Plex Mono', monospace; font-size: 22px; color: var(--text); }
  .summary-stat .lbl { font-size: 11px; color: var(--text-faint); margin-top: 2px; }

  @media (max-width: 680px) {
    .summary-grid { grid-template-columns: 1fr; gap: 4px; }
  }

  @media (max-width: 680px) {
    .wrap { padding: 20px 14px 60px; }
    h1 { font-size: 22px; }
    .meta-line { font-size: 11px; }
    .controls { gap: 8px; }
    button.iconbtn { padding: 8px 10px; }
    .tab { padding: 8px 11px; font-size: 11.5px; }
    .stat-grid { grid-template-columns: 1fr 1fr; }
    td, thead th { padding: 10px 8px; }
    td.name { max-width: 140px; }
    /* RSI14, Volym och info-knappen ryms i detaljvyn — döljs i tabellen för
       att ge Namn, Pris, P/E och Poäng plats. Hela raden går fortfarande
       att trycka på för att öppna detaljvyn. */
    thead th:nth-child(4), td:nth-child(4),
    thead th:nth-child(5), td:nth-child(5),
    thead th:nth-child(7), td:nth-child(7) { display: none; }
  }

  @media (max-width: 400px) {
    .overlay { padding: 24px 10px; }
    .drawer { padding: 18px; max-height: calc(100vh - 48px); }
    .stat-grid { gap: 10px; }
    thead th:nth-child(2), td:nth-child(2) { display: none; } /* Pris döljs på riktigt smala skärmar, finns i detaljvyn */
  }
</style>
</head>
<body data-theme="dark">
<div class="wrap">
  <header class="top">
    <div>
      <h1>Aktie<em>screener</em></h1>
      <div class="meta-line" id="metaLine">laddar…</div>
    </div>
    <div class="controls">
      <a class="iconbtn version-badge" id="versionBadge" href="#" target="_blank" rel="noopener">v –</a>
      <button class="iconbtn" id="themeToggle">LJUST LÄGE</button>
    </div>
  </header>

  <div class="tabs">
    <div class="tab active" data-tab="buy">KÖPKANDIDATER <span class="count" id="buyCount"></span></div>
    <div class="tab" data-tab="sell">MINA INNEHAV <span class="count" id="sellCount"></span></div>
  </div>

  <div class="panel">
    <div class="filter-row">
      <select id="marketFilter">
        <option value="ALL">Alla marknader</option>
        <option value="SE">Stockholm</option>
        <option value="US">USA</option>
        <option value="DE">Tyskland</option>
        <option value="JP">Japan</option>
        <option value="CN">Kina</option>
        <option value="HK">Hongkong</option>
        <option value="NL">Nederländerna</option>
        <option value="GB">Storbritannien</option>
      </select>
      <select id="sortSelect">
        <option value="score_desc">Sortera: poäng (hög→låg)</option>
        <option value="pe_asc">Sortera: P/E (lågt→högt)</option>
        <option value="rsi_asc">Sortera: RSI (lågt→högt)</option>
        <option value="vol_desc">Sortera: volymavvikelse</option>
      </select>
    </div>
    <div id="tableHost"></div>
  </div>

  <div id="summaryHost"></div>

  <footer class="note">
    Poängsättningen är ett grovt, regelbaserat filter baserat på P/E, SMA50/200,
    RSI14 och volymavvikelse mot 20-dagarssnitt — inte finansiell rådgivning.
    Data uppdateras schemalagt via GitHub Actions, se tidsstämpel ovan.
  </footer>
</div>

<div class="overlay" id="overlay">
  <div class="drawer" id="drawer"></div>
</div>

<script>
const state = { data: null, tab: 'buy', market: 'ALL', sort: 'score_desc' };

const themeToggle = document.getElementById('themeToggle');
function applyTheme(t) {
  document.body.setAttribute('data-theme', t);
  themeToggle.textContent = t === 'dark' ? 'LJUST LÄGE' : 'MÖRKT LÄGE';
  localStorage.setItem('screener-theme', t);
}
applyTheme(localStorage.getItem('screener-theme') || 'dark');
themeToggle.addEventListener('click', () => {
  applyTheme(document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});

document.querySelectorAll('.tab').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    state.tab = el.dataset.tab;
    render();
  });
});
document.getElementById('marketFilter').addEventListener('change', e => { state.market = e.target.value; render(); });
document.getElementById('sortSelect').addEventListener('change', e => { state.sort = e.target.value; render(); });

function fmtNum(n, digits=2) {
  if (n === null || n === undefined) return '–';
  return n.toLocaleString('sv-SE', { minimumFractionDigits: 0, maximumFractionDigits: digits });
}
function fmtVol(ratio) {
  if (!ratio) return '–';
  return ratio.toFixed(1) + '×';
}
  function fmtDate(iso) {
  if (!iso) return '–';
  const d = new Date(iso);
  return d.toLocaleDateString('sv-SE');
}
function escapeHtml(s) {
  if (!s) return '';
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}
function timeAgo(iso) {
  const d = new Date(iso);
  const mins = Math.round((Date.now() - d.getTime()) / 60000);
  if (mins < 60) return `${mins} min sedan`;
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return `${hrs} tim sedan`;
  return `${Math.round(hrs/24)} dygn sedan`;
}

async function load() {
  try {
    const res = await fetch('results.json?_=' + Date.now());
    if (!res.ok) throw new Error('no data');
    state.data = await res.json();
    document.getElementById('metaLine').textContent =
      `${state.data.count} tickers analyserade · uppdaterad ${timeAgo(state.data.generated_at)}`;
    const vb = document.getElementById('versionBadge');
    if (state.data.version) {
      vb.textContent = 'v ' + state.data.version;
      vb.href = `https://github.com/cvpw4tkrhd-wq/aktiescreener/commit/${state.data.version}`;
    } else {
      vb.textContent = '';
    }
  } catch (e) {
    document.getElementById('metaLine').textContent = 'Ingen data hittades ännu — kör workflowen i GitHub Actions.';
    document.getElementById('versionBadge').textContent = '';
    state.data = { results: [] };
  }
  render();
}

function sortRows(rows, key) {
  const s = [...rows];
  switch (key) {
    case 'pe_asc': s.sort((a,b) => (a.pe ?? 9999) - (b.pe ?? 9999)); break;
    case 'rsi_asc': s.sort((a,b) => (a.rsi14 ?? 9999) - (b.rsi14 ?? 9999)); break;
    case 'vol_desc': s.sort((a,b) => (b.volume_ratio ?? 0) - (a.volume_ratio ?? 0)); break;
    default: s.sort((a,b) => (state.tab === 'sell' ? (b.sell_score ?? 0) - (a.sell_score ?? 0) : (b.buy_score ?? 0) - (a.buy_score ?? 0)));
  }
  return s;
}

function render() {
  if (!state.data) return;
  let rows = state.data.results || [];
  if (state.market !== 'ALL') rows = rows.filter(r => r.market === state.market);

  const buyRows = rows.filter(r => !r.is_holding);
  document.getElementById('buyCount').textContent = buyRows.length ? `[${buyRows.length}]` : '';
  const sellRows = rows.filter(r => r.is_holding);
  document.getElementById('sellCount').textContent = sellRows.length ? `[${sellRows.length}]` : '';
  renderSummary(sellRows);

  const host = document.getElementById('tableHost');
  const activeRows = state.tab === 'sell' ? sellRows : buyRows;
  const sorted = sortRows(activeRows, state.sort);

  if (!sorted.length) {
    host.innerHTML = `<div class="empty">${state.tab === 'sell'
      ? 'Inga innehav matchade mot watchlist ännu. Lägg holdings.csv i /data och kör screenern.'
      : 'Ingen data ännu. Kör screenern via GitHub Actions eller lokalt.'}</div>`;
    return;
  }

  const rowsHtml = sorted.map(r => {
    const score = state.tab === 'sell' ? r.sell_score : r.buy_score;
    const delta = state.tab === 'sell' ? r.sell_score_delta : r.buy_score_delta;
    const days = state.tab === 'sell' ? r.sell_days_on_list : r.buy_days_on_list;
    const cls = state.tab === 'sell' ? 'sell' : 'buy';
    const trend = r.above_sma50 && r.above_sma200 ? 'up-txt' : (r.above_sma50 === false && r.above_sma200 === false ? 'down-txt' : 'dim');
    const flag = state.tab === 'sell' ? signalFlag(r) : null;
    return `<tr data-ticker="${r.ticker}">
      <td class="name">${r.name || r.watchlist_name}${flag ? `<span class="signal-flag ${flag.cls}">${flag.label}</span>` : ''}${r.previously_held ? '<span class="mkt-badge prev-held">TIDIGARE ÄGD</span>' : ''}${days >= 3 ? `<span class="mkt-badge days-badge" title="${days} körningar i rad med aktiv signal">${days}D</span>` : ''}<span class="tkr">${r.ticker}<span class="mkt-badge">${r.market}</span></span></td>
      <td class="num">${fmtNum(r.price)} ${r.currency || ''}</td>
      <td class="num">${r.pe !== null ? fmtNum(r.pe,1) : '–'}</td>
      <td class="num ${trend === 'up-txt' ? 'up-txt' : trend === 'down-txt' ? 'down-txt' : ''}">${r.rsi14 !== null ? fmtNum(r.rsi14,0) : '–'}</td>
      <td class="num dim">${fmtVol(r.volume_ratio)}</td>
      <td class="num">
        <div class="score-bar-wrap ${cls}">
          ${deltaHtml(delta)}
          <div class="score-bar"><div style="width:${score ?? 0}%"></div></div>
          <span class="score-num">${score ?? '–'}</span>
        </div>
      </td>
      <td class="num"><button class="info-btn" data-ticker="${r.ticker}" title="Visa alla nyckeltal" aria-label="Visa alla nyckeltal">ⓘ</button></td>
    </tr>`;
  }).join('');

  host.innerHTML = `<div class="table-scroll"><table>
    <thead><tr>
      <th>Aktie</th>
      <th class="num">Pris</th>
      <th class="num">P/E</th>
      <th class="num">RSI14</th>
      <th class="num">Volym</th>
      <th class="num">${state.tab === 'sell' ? 'Säljpoäng' : 'Köppoäng'}</th>
      <th class="num"></th>
    </tr></thead>
    <tbody>${rowsHtml}</tbody>
  </table></div>`;

  host.querySelectorAll('tbody tr').forEach(tr => {
    tr.addEventListener('click', () => openDrawer(tr.dataset.ticker));
  });
  host.querySelectorAll('.info-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      openDrawer(btn.dataset.ticker);
    });
  });
}

function openDrawer(ticker) {
  const r = state.data.results.find(x => x.ticker === ticker);
  if (!r) return;
  const reasons = state.tab === 'sell' ? (r.sell_reasons || []) : (r.buy_reasons || []);
  document.getElementById('drawer').innerHTML = `
    <button class="drawer-close" id="drawerClose">STÄNG ✕</button>
    <h2>${r.name || r.watchlist_name}</h2>
    <div class="tkr-line">${r.ticker} · ${r.market}${r.is_holding ? ' · INNEHAV' : ''}</div>
    <div class="stat-grid">
      <div><div class="stat-label">PRIS</div><div class="stat-val">${fmtNum(r.price)} ${r.currency||''}</div></div>
      <div><div class="stat-label">P/E</div><div class="stat-val">${r.pe !== null ? fmtNum(r.pe,1) : '–'}</div></div>
      <div><div class="stat-label">RSI14</div><div class="stat-val">${r.rsi14 !== null ? fmtNum(r.rsi14,0) : '–'}</div></div>
      <div class="stat-wide"><div class="stat-label">SMA50 / SMA200</div><div class="stat-val">${smaTrendHtml(r)}</div></div>
      <div><div class="stat-label">VOLYM</div><div class="stat-val">${fmtVol(r.volume_ratio)}</div></div>
      <div><div class="stat-label">P/B</div><div class="stat-val">${r.pb !== null ? fmtNum(r.pb,2) : '–'}</div></div>
      <div><div class="stat-label">UTDELNING</div><div class="stat-val">${r.dividend_yield_pct !== null ? fmtNum(r.dividend_yield_pct,1) + '%' : '–'}</div></div>
      <div><div class="stat-label">SKULDSÄTTNING (D/E)</div><div class="stat-val">${r.debt_to_equity !== null ? fmtNum(r.debt_to_equity,0) : '–'}</div></div>
      <div><div class="stat-label">VOLATILITET (ÅR)</div><div class="stat-val">${r.volatility_pct !== null ? fmtNum(r.volatility_pct,0) + '%' : '–'}</div></div>
      <div><div class="stat-label">BETA</div><div class="stat-val">${r.beta !== null ? fmtNum(r.beta,2) : '–'}</div></div>
      <div><div class="stat-label">ANALYTIKER</div><div class="stat-val">${r.recommendation_key ? r.recommendation_key.replace('_',' ').toUpperCase() : '–'}</div></div>
      <div><div class="stat-label">KURSMÅL</div><div class="stat-val">${r.target_mean_price ? fmtNum(r.target_mean_price) + ' ('+ (r.analyst_upside_pct>0?'+':'') + fmtNum(r.analyst_upside_pct,0) + '%)' : '–'}</div></div>
      <div><div class="stat-label">ANTAL ANALYTIKER</div><div class="stat-val">${r.num_analysts ?? '–'}</div></div>
      <div><div class="stat-label">DAGAR MED SIGNAL</div><div class="stat-val">${state.tab === 'sell' ? (r.sell_days_on_list ?? 0) : (r.buy_days_on_list ?? 0)}</div></div>
      <div><div class="stat-label">FÖRÄNDRING SEDAN SENAST</div><div class="stat-val">${(() => { const d = state.tab === 'sell' ? r.sell_score_delta : r.buy_score_delta; return d === null || d === undefined ? '–' : (d > 0 ? '+' : '') + d; })()}</div></div>
    </div>
        <ul class="reasons">${reasons.length ? reasons.map(x => `<li>${x}</li>`).join('') : '<li>Inga särskilda signaler.</li>'}</ul>
    ${r.ai_writeup ? `
    <div class="ai-writeup">
      <div class="stat-label">AI-KVALITETSANALYS <span class="ai-writeup-date">(${fmtDate(r.ai_writeup.generated_at)})</span></div>
      <p class="ai-writeup-text">${escapeHtml(r.ai_writeup.text).replace(/\n\n+/g, '</p><p class="ai-writeup-text">')}</p>
      <div class="ai-writeup-disclaimer">Genererad av Claude utifrån webbsökning, inte en fullständig analys av årsredovisningen. Verifiera själv innan beslut.</div>
    </div>` : ''}
  `;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('drawerClose').addEventListener('click', closeDrawer);
}
function closeDrawer() { document.getElementById('overlay').classList.remove('show'); }
document.getElementById('overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeDrawer(); });

function smaTrendHtml(r) {
  if (r.sma50 === null || r.sma200 === null) {
    return `${r.sma50 !== null ? fmtNum(r.sma50) : '–'} / ${r.sma200 !== null ? fmtNum(r.sma200) : '–'}`;
  }
  const bullish = r.sma50 > r.sma200;
  const symbol = bullish ? '▲' : (r.sma50 < r.sma200 ? '▼' : '–');
  const cls = bullish ? 'up-txt' : (r.sma50 < r.sma200 ? 'down-txt' : 'dim');
  const title = bullish ? 'SMA50 över SMA200 (uppåttrend)' : (r.sma50 < r.sma200 ? 'SMA50 under SMA200 (nedåttrend)' : 'SMA50 = SMA200');
  return `${fmtNum(r.sma50)} <span class="sma-trend ${cls}" title="${title}">${symbol}</span> ${fmtNum(r.sma200)}`;
}

function deltaHtml(delta) {
  if (delta === null || delta === undefined || delta === 0) return '';
  const up = delta > 0;
  return `<span class="score-delta ${up ? 'up-txt' : 'down-txt'}" title="Förändring sedan senaste körningen">${up ? '▲' : '▼'}${Math.abs(delta)}</span>`;
}

function signalFlag(r) {
  if ((r.sell_score || 0) >= 50) return { label: 'SÄLJ', cls: 'flag-sell' };
  if ((r.buy_score || 0) >= 65) return { label: 'KÖP', cls: 'flag-buy' };
  return { label: 'HÅLL', cls: 'flag-hold' };
}

function groupCount(rows, key) {
  const counts = {};
  for (const r of rows) {
    const k = r[key] || 'Okänd';
    counts[k] = (counts[k] || 0) + 1;
  }
  return Object.entries(counts).sort((a, b) => b[1] - a[1]);
}

function renderSummary(sellRows) {
  const el = document.getElementById('summaryHost');
  if (state.tab !== 'sell' || !sellRows.length) {
    el.innerHTML = '';
    return;
  }

  const total = sellRows.length;
  const sectors = groupCount(sellRows, 'sector');
  const countries = groupCount(sellRows, 'country');
  const avgSell = Math.round(sellRows.reduce((s, r) => s + (r.sell_score || 0), 0) / total);
  const highSell = sellRows.filter(r => (r.sell_score || 0) >= 50).length;

  const barRows = (list) => list.map(([label, count]) => `
    <div class="summary-row">
      <span class="label">${label}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${Math.round(count/total*100)}%"></span></span>
      <span class="val">${count}</span>
    </div>`).join('');

  el.innerHTML = `
    <div class="summary-panel">
      <div class="summary-stats">
        <div class="summary-stat"><div class="num">${total}</div><div class="lbl">INNEHAV I BEVAKNINGEN</div></div>
        <div class="summary-stat"><div class="num">${sectors.length}</div><div class="lbl">SEKTORER</div></div>
        <div class="summary-stat"><div class="num">${countries.length}</div><div class="lbl">LÄNDER</div></div>
        <div class="summary-stat"><div class="num">${avgSell}</div><div class="lbl">SNITTSÄLJPOÄNG</div></div>
        <div class="summary-stat"><div class="num">${highSell}</div><div class="lbl">MED SÄLJSIGNAL (≥50)</div></div>
      </div>
      <div class="summary-grid">
        <div class="summary-block">
          <h3>Fördelning per sektor</h3>
          ${barRows(sectors)}
        </div>
        <div class="summary-block">
          <h3>Fördelning per land</h3>
          ${barRows(countries)}
        </div>
      </div>
    </div>`;
}

load();
</script>
</body>
</html>
